name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Test
        run: npm test

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Type-check trusted-device implementation
        run: swiftc -typecheck ios/Sources/NeonGuardClient/TrustedDeviceStore.swift
